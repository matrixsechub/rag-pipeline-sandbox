name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m compileall -q src
      - name: Run tests (pipeline tests may not skip)
        env:
          RAG_REQUIRE_CHROMADB: "1"
        run: python -m pytest --tb=short -rs
